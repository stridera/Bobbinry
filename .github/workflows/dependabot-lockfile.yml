name: Dependabot lockfile

# Dependabot bumps the manifests but leaves bun.lock untouched in npm-workspace
# monorepos (dependabot/dependabot-core#14223, open upstream bug). Every PR it
# opens therefore dies at `bun install --frozen-lockfile` in CI before it even
# builds. This regenerates the lockfile on the PR branch and pushes it back.

on:
  pull_request:
    paths:
      - '**/package.json'

# The push uses a GitHub App installation token, not GITHUB_TOKEN, so nothing
# here needs write access.
permissions:
  contents: read

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the branch itself, not the detached merge commit, so we
          # have somewhere to push to.
          ref: ${{ github.head_ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Match ci.yml, so the lockfile is generated by the same bun that
          # later validates it with --frozen-lockfile.
          bun-version: latest

      # --lockfile-only resolves and writes bun.lock without installing anything,
      # so no dependency code executes in a job that holds a write token.
      - run: bun install --lockfile-only

      - id: check
        run: |
          if git diff --quiet bun.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "bun.lock already in sync — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat bun.lock
          fi

      # Everything below runs only when a push is needed. That matters beyond
      # tidiness: our own push re-fires this workflow (synchronize) with the App
      # bot as the actor, and only Dependabot-actor runs can read Dependabot
      # secrets — on the re-fired run `secrets.*` resolves to the (empty)
      # Actions store. Gating the credential steps on changed=true lets that
      # second run confirm the lockfile is in sync and finish green without
      # ever touching secrets, so the workflow settles after exactly one
      # regeneration rather than failing its own follow-up run.

      # On a Dependabot-authored pull_request, `secrets.*` resolves to the
      # repo's *Dependabot* secrets, never its Actions secrets. Both values
      # below must therefore live under Settings -> Secrets and variables ->
      # Dependabot. See .github/dependabot-lockfile-setup.md.
      - name: Verify App credentials are configured
        if: steps.check.outputs.changed == 'true'
        env:
          APP_ID: ${{ secrets.LOCKFILE_APP_ID }}
          APP_KEY: ${{ secrets.LOCKFILE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::LOCKFILE_APP_ID / LOCKFILE_APP_PRIVATE_KEY are not set." \
                 "Add them under Settings -> Secrets and variables -> Dependabot" \
                 "(NOT Actions — Dependabot PRs only see Dependabot secrets)." \
                 "Setup steps: .github/dependabot-lockfile-setup.md"
            exit 1
          fi

      # Mints an installation access token that expires in ~1h and is revoked
      # when the job ends, so no long-lived push credential sits in secrets.
      - name: Create App token
        if: steps.check.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.LOCKFILE_APP_ID }}
          private-key: ${{ secrets.LOCKFILE_APP_PRIVATE_KEY }}

      - name: Commit and push lockfile
        if: steps.check.outputs.changed == 'true'
        env:
          # Pushes made with GITHUB_TOKEN deliberately do not trigger workflow
          # runs, which would leave the fixed commit sitting with stale checks
          # forever. An App installation token does re-trigger CI, so the PR
          # can go green on its own.
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Committer stays github-actions[bot] rather than the App's own bot
          # identity: deriving that needs an extra API lookup for the bot's user
          # id, and what re-triggers CI is the token used to push, not the
          # author. Attribution here is cosmetic.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(deps): regenerate bun.lock" bun.lock
          git push "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${{ github.head_ref }}"
