name: Dependabot lockfile

# Dependabot bumps the manifests but leaves bun.lock untouched in npm-workspace
# monorepos (dependabot/dependabot-core#14223, open upstream bug). Every PR it
# opens therefore dies at `bun install --frozen-lockfile` in CI before it even
# builds. This regenerates the lockfile on the PR branch and pushes it back.

on:
  pull_request:
    paths:
      - '**/package.json'

# The push uses a PAT, not GITHUB_TOKEN, so nothing here needs write access.
permissions:
  contents: read

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Verify PAT is configured
        env:
          PAT: ${{ secrets.DEPENDABOT_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::DEPENDABOT_PAT is not set. Add a fine-grained PAT with" \
                 "Contents: read/write under Settings -> Secrets and variables ->" \
                 "Dependabot (NOT Actions — Dependabot PRs only see Dependabot secrets)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # Check out the branch itself, not the detached merge commit, so we
          # have somewhere to push to.
          ref: ${{ github.head_ref }}
          # Pushes made with GITHUB_TOKEN deliberately do not trigger workflow
          # runs, which would leave the fixed commit sitting with stale checks
          # forever. A PAT re-triggers CI so the PR can go green on its own.
          token: ${{ secrets.DEPENDABOT_PAT }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Match ci.yml, so the lockfile is generated by the same bun that
          # later validates it with --frozen-lockfile.
          bun-version: latest

      # --lockfile-only resolves and writes bun.lock without installing anything,
      # so no dependency code executes in a job that holds a write token.
      - run: bun install --lockfile-only

      - id: check
        run: |
          if git diff --quiet bun.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "bun.lock already in sync — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat bun.lock
          fi

      # Our own push re-fires this workflow (synchronize). That second run finds
      # the lockfile already in sync, reports changed=false, and stops — so this
      # settles after exactly one regeneration rather than looping.
      - name: Commit and push lockfile
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(deps): regenerate bun.lock" bun.lock
          git push
