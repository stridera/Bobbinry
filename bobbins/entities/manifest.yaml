id: entities
name: Entities
version: 1.8.5
author: "Bobbins Core"
description: "Configurable entity system for characters, spells, locations, items, and more"
tags: [worldbuilding, rpg, entities, configurable]
license: MIT
category: organize

install:
  scopes: [collection, project]

capabilities:
  publishable: false
  external: false
  ai: false
  customViews: true
data:
  collections:
    - name: entity_type_definitions
      fields:
        - { name: type_id, type: text, required: true }
        - { name: label, type: text, required: true }
        - { name: icon, type: text }
        - { name: template_id, type: text }
        - { name: base_fields, type: json }
        - { name: custom_fields, type: json }
        - { name: editor_layout, type: json }
        - { name: list_layout, type: json }
        - { name: subtitle_fields, type: json }

ui:
  views:
    - id: config
      name: Type Editor
      type: tree
      source: entity_type_definitions
      handlers:
        - entity_type_definitions
      priority: 10
    - id: entity-list
      name: Entity View
      type: custom
      source: "*"
      handlers: []
      priority: 30
    - id: entity-editor
      name: Entity Editor
      type: custom
      source: "*"
      handlers: []
      priority: 20
    - id: publishing
      name: Types
      type: custom
      source: "*"
      handlers: []
      priority: 40

interactions:
  actions:
    - id: create_entity_type
      name: Create Entity Type
      type: create
      target: entity_type_definitions

extensions:
  contributions:
    - slot: shell.leftPanel
      type: panel
      id: entities-navigation
      icon: users
      home:
        entityType: entity_type_definitions
        entityId: publishing
        metadata: { view: publishing, typeLabel: Types, typeIcon: "📚" }
      # Top-bar search while an entities view is active: find-only across
      # every entity type; a hit opens that entity's editor.
      search:
        kind: records
        placeholder: "Search characters, places & lore…"
        collections:
          - { name: "*", entityType: "$collection", metadata: { view: entity-editor, isNew: false } }
      # One record collection per entity type definition. The breadcrumb's
      # group crumb is the type's list view, in the same shape the Types view
      # dispatches ($collection/$label/$icon come from the definition record).
      records:
        - discover: { collection: entity_type_definitions, idField: type_id, labelField: label, iconField: icon }
          titleField: name
          metadata: { view: entity-editor }
          group:
            entityId: list
            metadata: { view: entity-list, typeId: $collection, typeLabel: $label, typeIcon: $icon }
      quickOpen: { label: Entities, icon: person }
      title: "Entities"
      entry: panels/navigation
    - slot: shell.rightPanel
      priority: 10
      icon: eye
      type: panel
      id: entity-preview
      title: "Entity Preview"
      entry: panels/entity-preview
      # Surface this panel when an entity is clicked in the editor or the
      # navigation panel — the shell has no other knowledge of this bobbin.
      revealOn: ['bobbinry:entity-preview']
      when:
        entityType: content

external: null

linking:
  entities: []

publish: null

compatibility:
  minShellVersion: 1.0.0
  migrations: []
