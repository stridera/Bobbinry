id: dictionary-panel
name: Dictionary Panel
version: 1.3.0
author: "Bobbins Samples"
description: "Right-side panel with dictionary definitions and thesaurus. Definitions come from the Bobbinry API (cached, Wiktionary-backed); synonyms and antonyms from Datamuse."
tags: [panel, dictionary, thesaurus, pubsub]
license: MIT
category: augment
capabilities: { publishable: false, external: true, ai: false, customViews: false }
compatibility:
  minShellVersion: "0.1.0"
extensions:
  contributions:
    - slot: shell.rightPanel
      type: panel
      id: dictionary-panel
      title: "Dictionary"
      entry: panels/dictionary-panel
      priority: 4
      when:
        entityType: content
data:
  collections: []
# Definitions are served by the Bobbinry API (/api/dictionary/:word), which
# caches them and falls back to Wiktionary, so no third-party dictionary
# permission is needed. Datamuse is still called directly from the browser.
external:
  endpoints:
    - id: synonyms
      url: https://api.datamuse.com/words
      method: GET
      description: Retrieve synonyms and antonyms for the selected word
  permissions:
    - endpoint: api.datamuse.com/words
      reason: Fetch related words for thesaurus suggestions
      required: true
