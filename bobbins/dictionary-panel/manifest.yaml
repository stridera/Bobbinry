id: dictionary-panel
name: Dictionary Panel
version: 1.4.0
author: "Bobbins Samples"
description: "Right-side panel with dictionary definitions and thesaurus. Definitions (cached, Wiktionary-backed) and synonyms/antonyms (Datamuse) both come through the Bobbinry API."
tags: [panel, dictionary, thesaurus, pubsub]
license: MIT
category: augment
capabilities: { publishable: false, external: false, ai: false, customViews: false }
compatibility:
  minShellVersion: "0.1.0"
extensions:
  contributions:
    - slot: shell.rightPanel
      icon: book
      type: panel
      id: dictionary-panel
      title: "Dictionary"
      entry: panels/dictionary-panel
      priority: 6
      when:
        entityType: content
data:
  collections: []
# Definitions and synonyms are both served by the Bobbinry API
# (/api/dictionary/:word, /api/thesaurus/:word), so the panel makes no
# third-party requests from the browser and needs no external permissions.
